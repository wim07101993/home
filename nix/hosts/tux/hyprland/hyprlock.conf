general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(1e1e2e)
}

input-field {
    monitor =
    size = 600, 80
    position = 0, 0
    halign = center
    valign = center

    rounding = 0
    outline_thickness = 2
    outer_color = rgb(89b4fa)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    font_family = CaskaydiaMono Nerd Font
    placeholder_text = Password, or Enter for your face
    fail_text = $FAIL ($ATTEMPTS)
    fade_on_empty = false
    shadow_passes = 0
}
