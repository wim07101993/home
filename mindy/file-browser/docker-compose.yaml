services:
  filebrowser:
    container_name: filebrowser
    image: gtstef/filebrowser:1.5.6-stable-slim
    networks:
      - traefik_traefik-network
      - db_db-network
      - filebrowser-network
    volumes:
      - /docker-volumes/filebrowser/config:/home/filebrowser/data
      # Long-form bind with rslave propagation. /docker-volumes/filebrowser/files
      # holds nine x-systemd.automount NFS mounts from samson (see mindy/fstab),
      # which are established lazily on first access -- i.e. AFTER this container
      # starts. With the default (private) propagation the container would keep
      # the empty pre-mount view forever and serve empty directories.
      - type: bind
        source: /docker-volumes/filebrowser/files
        target: /files
        bind:
          propagation: rslave
          # Long-form binds do not create a missing source path, and
          # portainer redeploys this stack from git unattended -- a
          # missing directory would be a silent container failure.
          create_host_path: true
    ports:
      - "8900:80"
    restart: unless-stopped
    environment:
      - "FILEBROWSER_CONFIG=/home/filebrowser/data/config.yaml"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_traefik-network"
      - "traefik.http.routers.drive.rule=Host(`drive.wvl.app`)"
      - "traefik.http.routers.drive.entrypoints=websecure"
      - "traefik.http.routers.drive.tls.certresolver=le"
      - "traefik.http.middlewares.fb-size-limit.buffering.maxRequestBodyBytes=2000000000"
      # Router is named `drive` (line above), not `filebrowser`. Naming a
      # non-existent router here made traefik invent one with a default
      # rule of Host(`filebrowser-filebrowser`), which then requested an
      # ACME cert for a hostname with no dot -- failing on a loop -- while
      # the size limit was never applied to drive.wvl.app at all.
      - "traefik.http.routers.drive.middlewares=fb-size-limit"
networks:
  filebrowser-network:
  db_db-network:
    external: true
  traefik_traefik-network:
    external: true
