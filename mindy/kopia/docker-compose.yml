services:
  kopia:
    container_name: kopia
    image: kopia/kopia:0.23.1
    restart: unless-stopped
    volumes:
      - /docker-volumes:/data:ro
      - /docker-volumes/kopia/kopia-config:/app/config
      - /docker-volumes/kopia/kopia-cache:/app/cache
    environment:
      - KOPIA_SERVER_USERNAME=wim
      - KOPIA_SERVER_PASSWORD=YourStrongPassword123 # I know credentials in git is not done, but this server is ran only locally and environment variables from portainer don't work...
    ports:
      - "51515:51515"
    command:
      - server
      - start
      - --insecure
      - --address=0.0.0.0:51515
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: 0.25
