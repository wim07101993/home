name: renovate

on:
  schedule:
    # Monday 06:00 UTC. This decides when Renovate RUNS; the `schedule` in
    # renovate.json decides when it is allowed to open PRs.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run: log what would happen, open nothing"
        type: boolean
        default: true
      logLevel:
        description: "Log level"
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Renovate manages the github-actions ecosystem too, so once this runs it
      # keeps its own action version current.
      - uses: renovatebot/github-action@v46.3.9
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
