name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npx --yes --package renovate@44 renovate-config-validator --no-global renovate.json

  tofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tofu
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.2
      - run: tofu fmt -check -recursive -diff
      # -backend=false: the pg backend is only reachable over Tailscale.
      # validate checks syntax, types and module wiring without it.
      - run: tofu init -backend=false -input=false
      - run: tofu validate
