# samson:/etc/btrbk/btrbk.conf
#
# Local full backup of the btrfs array to the 14 TB USB drive.
#
# NOT deployed automatically -- portainer only manages docker stacks. Copy this
# to /etc/btrbk/btrbk.conf on samson by hand. Runbook: ./README.md
#
# Why btrfs send/receive rather than kopia or rsync:
#   - the source is already btrfs with one subvolume per share, so sends are
#     incremental at block level -- no 8 TB metadata walk per run
#   - the result is a browsable filesystem: mount the drive anywhere and the
#     files are simply there, no software and no password required
#   - checksums end to end, and `btrfs scrub` on the backup drive itself
#     detects bitrot on the copy
#   - dedup/compression (kopia's strengths) buy ~nothing on H.264/H.265, which
#     is 98% of the data by size
#
# kopia -> Hetzner Storage Box stays as-is and does a different job: encrypted,
# versioned, off-site, covering the ~119 GB that is irreplaceable. This drive is
# the fast local full replica. Two copies, two failure modes, two tools.

transaction_log         /var/log/btrbk.log
lockfile                /var/lock/btrbk.lock

timestamp_format        long
stream_buffer           256m

# Snapshots live in one directory per volume rather than beside each subvolume,
# so OMV's shared-folder view stays clean.
snapshot_dir            _btrbk_snap

# On the ARRAY: snapshot retention MUST outlive the longest gap between visits.
#
# This drive lives off-site at family. It is fetched roughly every 4 MONTHS,
# stays here about a week, then goes back -- deliberately not carried on every
# visit, because a drive that is here half the time is just a second local copy
# sharing every risk the array has. A 4-month cycle keeps it off-site ~94% of
# the time.
#
# btrbk sends incrementally by finding a snapshot present on BOTH array and
# drive; if the array has pruned it there is no common parent and btrbk falls
# back to a FULL 8.4 TB send -- 13-16 hours at USB 3.0, every visit, forever.
#
# Retention must be a MULTIPLE of the visit interval, never equal to it, or the
# previous snapshot expires at exactly the moment it is needed as a parent.
# 18 months gives four cycles of margin and tolerates a badly slipped schedule.
#
# The cost is near zero: btrbk only creates a snapshot when it runs, so this
# cadence produces ~3 snapshots a year. CoW means they pin only blocks that have
# since changed or been deleted -- and the unique data here is films and series,
# which are append-mostly.
snapshot_preserve_min   18m
snapshot_preserve       36m

# On the BACKUP DRIVE: history lives here. At ~3 backups a year, keeping many
# years costs little -- each is an incremental over the last.
#
# `target_preserve_min latest` is load-bearing. btrbk only CREATES a target
# backup if the retention scheme would keep it. With monthly/yearly buckets
# alone, a second run in the same month lands in an already-filled bucket, so
# btrbk skips the transfer and reports:
#
#     Checking for missing backups ... No missing backups found
#
# -- a silent no-op. That breaks the most important run of all: the top-up
# taken just before the drive goes back off-site. `latest` guarantees the
# newest backup is always preserved, and therefore always created.
#
# The `7d` adds a week of daily slots, which covers the days the drive is
# physically in the house.
target_preserve_min     latest
target_preserve         7d 24m 10y

volume /srv/dev-disk-by-uuid-25d0f3ec-68a9-4ce0-891e-0966088e5300

  target /mnt/backup-14t

  # ---- irreplaceable (~119 GB) -------------------------------------------
  # Also covered by kopia -> Storage Box. Back these up FIRST: they finish in
  # minutes, so a complete local copy of everything that matters exists before
  # the long media run starts.
  subvolume photos
  subvolume audio
  subvolume audio-archive
  subvolume gezin-officieel
  subvolume gezin-officieel-archive
  subvolume wim
  subvolume sara
  subvolume backups

  # ---- replaceable, but this is its ONLY second copy (~8.3 TB) -----------
  # kopia covers ~810 GB of hand-picked directories; the remaining ~7.5 TB has
  # existed in exactly one place until now.
  subvolume media
