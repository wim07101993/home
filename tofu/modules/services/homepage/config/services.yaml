# THE source of truth. Uploaded into the container by ../main.tf -- edit here
# and `tofu apply`.
#
# Until 2026-09-17 this was a copy of /docker-volumes/homepage/config on mindy
# that nobody had to sync, and it had drifted. Uploading fixed the mechanism;
# it did not fix the contents, and a full audit against `docker ps` on all four
# hosts on 2026-09-24 found it still wrong:
#
#   Score listed under Bumba      it has run on mindy since 2026-09-17
#   Plop listed a Database        plop has never had postgres -- no container,
#                                 nothing listening on 5432
#   Status missing                gatus, the thing that watches everything else
#   Partituren missing            routed since March
#
# Grouped by HOST, so this doubles as the answer to "what runs where". Three
# containers are deliberately absent because they have no interface to link to:
# storage-box-proxy on bumba (socat), databasus-backup-check on samson, and
# matterjs-server on plop.
#
# Icons are local files from ../icons, uploaded alongside. An entry with no
# icon has no file there -- homepage renders the initial instead, which is
# honest and costs nothing.

