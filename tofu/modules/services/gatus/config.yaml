concurrency: 5
skip-invalid-config-update: false

web:
  port: 8080

storage:
  type: sqlite
  path: /data/data.db
  caching: true
  maximum-number-of-results: 200
  maximum-number-of-events: 50

ui:
  title: "status ǀ wvl.app"
  header: "wvl.app"
  dashboard-heading: "Health"
  default-sort-by: health
  login-subtitle: "Sign in with wvl.app"

security:
  oidc:
    # TODO use variable from zitadel
    issuer-url: "https://auth.wvl.app"
    redirect-url: "https://status.wvl.app/authorization-code/callback"
    client-id: "${GATUS_OIDC_CLIENT_ID}"
    client-secret: "${GATUS_OIDC_CLIENT_SECRET}"
    scopes: ["openid"]
    session-ttl: 8h
    # Empty = anyone who authenticates
    allowed-subjects: []

alerting:
  email:
    host: "smtp.eu.mailgun.org"
    port: 587
    from: "status@mail.wvl.app"
    to: "status@wvl.app"
    username: "${GATUS_SMTP_USERNAME}"
    password: "${GATUS_SMTP_PASSWORD}"
    default-alert:
      description: "healthcheck failed"
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 2

  ntfy:
    url: "${GATUS_NTFY_URL}"
    topic: "${GATUS_NTFY_TOPIC}"
    token: "${GATUS_NTFY_TOKEN}"
    priority: 2
    click: "https://status.wvl.app"
    default-alert:
      description: "healthcheck failed"
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 2
    overrides:
      - group: auth
        priority: 4
      - group: hosts
        priority: 4
      - group: backups
        priority: 4

endpoints:
  - name: zitadel
    group: auth
    url: "https://auth.wvl.app/debug/ready"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: email
      - type: ntfy

  - name: keuken
    group: apps
    url: "https://keuken.wvl.app/"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: email
      - type: ntfy

  - name: memo
    group: apps
    url: "https://memo.wvl.app/healthz"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: email
      - type: ntfy

  - name: drive
    group: apps
    url: "https://drive.wvl.app/health"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].message == ok"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: email
      - type: ntfy

  - name: photos
    group: apps
    url: "https://photos.wvl.app/api/server/ping"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].res == pong"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: email
      - type: ntfy

  - name: score
    group: apps
    url: "https://score.wvl.app/"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: email
      - type: ntfy

  - name: score-api
    group: apps
    url: "https://score-api.wvl.app/healthz"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: email
      - type: ntfy

  - name: partituren
    group: apps
    url: "https://partituren.wvl.app/"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: email
      - type: ntfy

  - name: homepage
    group: apps
    url: "https://homepage.wvl.app/"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: email
      - type: ntfy

  - name: it-tools
    group: apps
    url: "https://it-tools.wvl.app/"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: email
      - type: ntfy

  - name: tasks
    group: apps
    url: "https://tasks.wvl.app/api/v1/health"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: email
      - type: ntfy

  - name: music
    group: apps
    url: "https://music.wvl.app/ping"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: email
