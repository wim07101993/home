  - name: music-player
    group: apps
    url: "https://music.wvl.app/"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: email
      - type: ntfy

  # ---- hosts ----------------------------------
  - name: mindy
    group: hosts
    url: "icmp://100.127.106.121"
    interval: 15m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: email
      - type: ntfy

  - name: samson
    group: hosts
    url: "icmp://100.71.248.106"
    interval: 15m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: email
      - type: ntfy

  - name: plop
    group: hosts
    url: "icmp://100.117.36.52"
    interval: 15m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: email
      - type: ntfy

  # ---- backups ---------------------------------

  - name: databasus
    group: backups
    url: "http://100.71.248.106:4005/api/v1/system/health"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == HEALTHY"
    alerts:
      - type: email
      - type: ntfy

  - name: rest-server
    group: backups
    url: "http://100.71.248.106:8000/healthz"
    interval: 15m
    conditions:
      - "[STATUS] == 204"
    alerts:
      - type: email
      - type: ntfy
