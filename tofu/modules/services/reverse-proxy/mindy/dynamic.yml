# Traefik DYNAMIC configuration for mindy. Uploaded to /etc/traefik/dynamic.yml.
#
# Every route on this host. Backends use the container name, resolvable on the
# user-defined network, and the CONTAINER port -- not the host-published one.
#
# A service missing from here is unreachable: no auto-discovery, so adding a
# service means editing this file.
#
# No `status` route: uptime-kuma is not deployed yet, and when it is it goes on
# bumba rather than here. mindy/docker-compose.yaml carries labels for it, but
# the container has never existed -- `docker network inspect` on 2026-09-17
# listed seven containers and it was not among them.

http:
  routers:
    dashboard:
      rule: "Host(`traefik.wvl.app`)"
      entryPoints: [websecure]
      service: api@internal
      tls:
        certResolver: le

    # Router `drive`, middleware `drive-size-limit`: one stem, so they cannot
    # disagree. Under compose they were `drive` and `fb-size-limit`, and the
    # middleware was attached to a router called `filebrowser` that did not
    # exist -- traefik invented one with a rule of
    # Host(`filebrowser-filebrowser`), looped forever on ACME for a hostname
    # with no dot, and never applied the limit. Nothing errored.
    drive:
      rule: "Host(`drive.wvl.app`)"
      entryPoints: [websecure]
      service: filebrowser
      middlewares: [drive-size-limit]
      tls:
        certResolver: le

    photos:
      rule: "Host(`photos.wvl.app`)"
      entryPoints: [websecure]
      service: immich
      tls:
        certResolver: le

    homepage:
      rule: "Host(`homepage.wvl.app`)"
      entryPoints: [websecure]
      service: homepage
      tls:
        certResolver: le

    it-tools:
      rule: "Host(`it-tools.wvl.app`)"
      entryPoints: [websecure]
      service: it-tools
      tls:
        certResolver: le

    keuken:
      rule: "Host(`keuken.wvl.app`)"
      entryPoints: [websecure]
      service: kitchen-owl
      tls:
        certResolver: le

    memo:
      rule: "Host(`memo.wvl.app`)"
      entryPoints: [websecure]
      service: memos
      tls:
        certResolver: le

  middlewares:
    drive-size-limit:
      buffering:
        maxRequestBodyBytes: 2000000000

  services:
    filebrowser:
      loadBalancer:
        servers:
          - url: "http://filebrowser:80"

    immich:
      loadBalancer:
        servers:
          - url: "http://immich:2283"

    homepage:
      loadBalancer:
        servers:
          - url: "http://homepage:3000"

    it-tools:
      loadBalancer:
        servers:
          - url: "http://it-tools:80"

    kitchen-owl:
      loadBalancer:
        servers:
          - url: "http://kitchen-owl:8080"

    memos:
      loadBalancer:
        servers:
          - url: "http://memos:5230"

