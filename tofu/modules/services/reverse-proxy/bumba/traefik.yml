# Traefik STATIC configuration for bumba. Uploaded to /etc/traefik/traefik.yml.
#
# A real YAML file, not yamlencode output, so editors, the traefik JSON schema
# and anything copy-pasted from the docs all work on it directly.
#
# Static only. Routers, services and middlewares cannot go here -- they are
# dynamic config and live in dynamic.yml. That split is traefik's, not ours:
# static needs a restart, dynamic is hot-reloaded.

log:
  level: DEBUG

api:
  dashboard: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"
    asDefault: true
    http:
      tls:
        certResolver: le
    # mindy's traefik sets respondingTimeouts of 600s for large uploads.
    # bumba has never needed it; add `transport.respondingTimeouts` here if
    # that changes.

# File only. No docker provider, which is what lets the docker socket stay
# unmounted -- see main.tf.
providers:
  file:
    filename: /etc/traefik/dynamic.yml
    # INERT, and kept anyway. dynamic.yml arrives through an `upload` block,
    # which is part of the container spec -- so any routing change REPLACES this
    # container and the file is never edited underneath a running traefik. The
    # watch has nothing to fire on.
    #
    # Left in place because removing it invites someone to re-add it later
    # expecting hot-reload. Getting real hot-reload means writing the file
    # outside the container lifecycle, and tofu reaches these hosts only through
    # the docker provider over SSH, where `upload` IS the file-writing
    # primitive. The alternative is traefik's KV provider, which buys hot-reload
    # and puts a stateful dependency in front of every site on the host.
    watch: true

certificatesResolvers:
  le:
    acme:
      email: wvl@wvl.app
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
